name: Refresh security lock

on:
  push:
    branches:
      - chore/security-nanoid-fix
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/security-nanoid-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Refresh lockfile for nanoid security fix"
          git push origin HEAD:chore/security-nanoid-fix
