name: VPS Deploy Template

# This workflow is intentionally manual until a real VPS/customer is approved.
# Copy/adapt it per production customer repository or enable push triggers only
# after GitHub Environment protection and secrets are configured.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag; defaults to the selected commit SHA"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve immutable image tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [[ -z "${tag}" ]]; then tag="${GITHUB_SHA}"; fi
          if [[ "${tag}" == "latest" ]]; then echo "latest is not allowed" >&2; exit 1; fi
          image="${REGISTRY}/${IMAGE_NAME,,}:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/vps/Dockerfile.public-web
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and health-check
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_APP_DIR:?Missing VPS_APP_DIR}"
          : "${IMAGE:?Missing image output}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "/opt/qira/bin/deploy.sh '$VPS_APP_DIR' '$IMAGE'"
