<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="qiraMarkTitle qiraMarkDesc">
  <title id="qiraMarkTitle">QIRA</title>
  <desc id="qiraMarkDesc">Simbol Q Prism Ray QIRA dengan ambient cyan glow</desc>
  <defs>
    <!-- Vibrant Ring Gradient -->
    <linearGradient id="qRingGrad" x1="16" y1="14" x2="99" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#1769FF"/>
      <stop offset="100%" stop-color="#0A3AB5"/>
    </linearGradient>

    <!-- Electric Neon Cyan Beam Gradient -->
    <linearGradient id="qBeamGrad" x1="67" y1="64" x2="117" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#1769FF"/>
    </linearGradient>

    <!-- Radiant Cyan Ambient Glow Backing -->
    <radialGradient id="qCyanAmbientAura" cx="64" cy="64" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#00D2FF" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#1769FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Master Cyan Glow Filter -->
    <filter id="qAmbientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Intense 360-degree ambient cyan halo -->
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.85"/>
      <!-- Soft spreading cyan atmosphere -->
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00D2FF" flood-opacity="0.55"/>
      <!-- Deep royal blue elevation -->
      <feDropShadow dx="0" dy="5" stdDeviation="20" flood-color="#1769FF" flood-opacity="0.45"/>
    </filter>

    <filter id="qAuraBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Ambient Cyan Aura Halo layer -->
  <circle cx="64" cy="64" r="48" fill="url(#qCyanAmbientAura)" filter="url(#qAuraBlur)"/>

  <!-- Glowing Q Symbol -->
  <g filter="url(#qAmbientGlow)">
    <!-- Precision Torus with 45° cut -->
    <path d="M 55.3 14.12 C 30.92 14.12 11.22 33.82 11.22 58.2 C 11.22 82.58 30.92 102.28 55.3 102.28 C 68.52 102.28 80.36 96.6 88.48 87.43 L 73.63 72.58 C 69.45 76.99 62.96 80.01 55.3 80.01 C 43.26 80.01 33.49 70.24 33.49 58.2 C 33.49 46.16 43.26 36.39 55.3 36.39 C 67.34 36.39 77.11 46.16 77.11 58.2 C 77.11 62.84 75.6 67.02 73.16 70.38 L 88.01 85.23 C 95.55 78.04 99.38 68.06 99.38 58.2 C 99.38 33.82 79.68 14.12 55.3 14.12 Z" fill="url(#qRingGrad)"/>
    <!-- Razor Prism Beam Tail (Cut cleanly at 45° - No dot) -->
    <path d="M 66.9 72.12 L 108.66 113.88 L 116.78 105.76 L 75.02 64 L 66.9 72.12 Z" fill="url(#qBeamGrad)"/>
  </g>
</svg>
