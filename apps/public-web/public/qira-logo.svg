<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" fill="none" role="img" aria-labelledby="qiraLogoTitle qiraLogoDesc">
  <title id="qiraLogoTitle">QIRA</title>
  <desc id="qiraLogoDesc">Master Integrated QIRA Wordmark</desc>
  <defs>
    <!-- Ring Gradient -->
    <linearGradient id="qRingGradFull" x1="16" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#1769FF"/>
      <stop offset="100%" stop-color="#0A3AB5"/>
    </linearGradient>

    <!-- Prism Ray Gradient (Razor Beam) -->
    <linearGradient id="qBeamGradFull" x1="62" y1="62" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#1769FF"/>
    </linearGradient>

    <!-- Radiant Cyan Ambient Glow Backing -->
    <radialGradient id="qCyanAmbientAuraFull" cx="50" cy="48" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#1769FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="qAuraBlurFull" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Master Cyan Glow Filter -->
    <filter id="qMasterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <!-- Intense 360-degree ambient cyan halo -->
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.8"/>
      <!-- Soft ambient cyan aura -->
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00D2FF" flood-opacity="0.45"/>
      <!-- Depth shadow -->
      <feDropShadow dx="0" dy="4" stdDeviation="18" flood-color="#1769FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Cyan Aura behind Q -->
  <circle cx="50" cy="48" r="42" fill="url(#qCyanAmbientAuraFull)" filter="url(#qAuraBlurFull)"/>

  <g filter="url(#qMasterGlow)">
    <!-- THE 'Q' PRISM CORE -->
    <path d="M 50 10 C 28.98 10 12 26.98 12 48 C 12 69.02 28.98 86 50 86 C 61.4 86 71.6 81.1 78.6 73.2 L 65.8 60.4 C 62.2 64.2 56.6 66.8 50 66.8 C 39.62 66.8 31.2 58.38 31.2 48 C 31.2 37.62 39.62 29.2 50 29.2 C 60.38 29.2 68.8 37.62 68.8 48 C 68.8 52 67.5 55.6 65.4 58.5 L 78.2 71.3 C 84.7 65.1 88 56.5 88 48 C 88 26.98 71.02 10 50 10 Z" fill="url(#qRingGradFull)"/>
    <path d="M 60 60 L 96 96 L 103 89 L 67 53 L 60 60 Z" fill="url(#qBeamGradFull)"/>

    <!-- THE 'I' PILLAR -->
    <rect x="126" y="14" width="16" height="70" rx="3" fill="#FFFFFF"/>

    <!-- THE 'R' STRUCTURE -->
    <rect x="168" y="14" width="16" height="70" rx="3" fill="#FFFFFF"/>
    <!-- Bowl with transparent hole via fill-rule evenodd -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 184 14 H 212 C 223.05 14 232 22.95 232 34 C 232 45.05 223.05 54 212 54 H 184 V 14 Z M 184 27.5 H 210 C 213.59 27.5 216.5 30.41 216.5 34 C 216.5 37.59 213.59 40.5 210 40.5 H 184 V 27.5 Z" fill="#FFFFFF"/>
    <!-- 45-degree diagonal leg matching Q prism beam angle -->
    <path d="M 198 48 L 228 84 H 248 L 214 48 H 198 Z" fill="#FFFFFF"/>

    <!-- THE 'A' ARCHITECTURAL APEX (with transparent center hole via evenodd) -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M 292 14 L 261 84 H 279 L 286.5 67 H 317.5 L 325 84 H 343 L 312 14 H 292 Z M 292 38 L 311.5 54 H 288.5 Z" fill="#FFFFFF"/>
  </g>
</svg>
