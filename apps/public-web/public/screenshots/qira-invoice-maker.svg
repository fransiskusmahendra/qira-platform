ize:13px}.meta-block strong{display:block;color:#0759ee;margin-bottom:5px}.bill{padding:21px 0 17px}.blue{color:#0759ee;font-size:13px;font-weight:800}.bill h2{font-size:18px;margin:12px 0 7px}.bill p{font-size:12px;margin:0;color:#42516a}.items table{width:100%;border-collapse:collapse;font-size:11px}.items th{background:linear-gradient(90deg,#064fdc,#0865f3);color:white;padding:12px 9px}.items td{padding:15px 10px;border-bottom:1px solid #4d86f8;text-align:center}.items td:nth-child(2){text-align:left}.bottom{display:grid;grid-template-columns:54% 46%;gap:28px;margin-top:18px}.notes{padding-top:40px;font-size:11px;line-height:1.55}.totals>div{display:flex;justify-content:space-between;padding:8px 18px;border-top:1px solid #4d86f8;font-size:12px}.totals .grand{background:#0759ee;color:#fff;font-size:15px}.payment{padding:14px 17px;font-size:10px;line-height:1.45}.demo{position:fixed;right:18px;top:18px;background:#071a33;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:700;z-index:10}
