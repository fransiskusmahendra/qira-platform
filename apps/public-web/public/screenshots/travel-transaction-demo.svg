<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<foreignObject width="1600" height="900">
<body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;width:1600px;height:900px;overflow:hidden">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#163146;font-family:Arial,Helvetica,sans-serif}.page{min-height:900px;padding:38px 58px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:14px;align-items:center}.mark{width:46px;height:46px;border-radius:12px;background:#0075bd;color:white;display:grid;place-items:center;font-weight:900;font-size:24px}.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0 0;color:#607888;font-size:13px}.demo{background:#e8f3fb;color:#00669f;border:1px solid #b9d9eb;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:800}.layout{display:grid;grid-template-columns:minmax(560px,1fr) 390px;gap:28px;align-items:start}.card{background:white;border:1px solid #dce8ef;border-radius:18px;box-shadow:0 14px 38px rgba(31,71,96,.07);padding:28px}.card h2{margin:0 0 8px;font-size:20px}.subtitle{color:#6b8290;font-size:13px;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:12px;font-weight:700;color:#506777;margin-bottom:7px}.input{height:44px;border:1px solid #cbdbe5;border-radius:9px;background:#fbfdff;padding:12px 13px;color:#274153;font-size:14px}.field.full{grid-column:1/-1}.premium{display:flex;gap:10px}.chip{padding:10px 15px;border:1px solid #cbdbe5;border-radius:9px;background:white;font-size:13px}.chip.active{border-color:#0075bd;background:#edf7fc;color:#00669f;font-weight:800}.actions{display:flex;gap:12px;margin-top:22px}.btn{height:44px;border-radius:9px;padding:0 18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}.primary{background:#0075bd;color:white;flex:1}.secondary{border:1px solid #cbdbe5;background:#fff;color:#345365}.receipt-wrap{background:#eef4f7;border-radius:18px;padding:22px;display:flex;justify-content:center}.receipt{width:300px;background:white;padding:18px 16px 20px;box-shadow:0 10px 28px rgba(0,0,0,.10);font-family:'Courier New',monospace;color:#000;font-size:11px;line-height:1.35}.receipt h3{text-align:center;margin:0 0 9px;font-size:16px}.rule{border-top:1px dashed #222;margin:7px 0}.row{margin:3px 0}.benefit{margin:6px 0}.benefit b{display:block}.notice{margin-top:18px;background:#f1f7fa;border-radius:11px;padding:12px 14px;color:#59717f;font-size:12px}.masked{display:inline-block;background:#dfe7ec;color:transparent;border-radius:3px;padding:0 28px;height:11px;vertical-align:middle}
</style>
<div class="page"><div class="top"><div class="brand"><div class="mark">J</div><div><h1>Cetak Nota · Travel Protection</h1><p>Input transaksi dan cetak nota thermal 80 mm</p></div></div><div class="demo">DATA CONTOH · TANPA DATA PENUMPANG NYATA</div></div>
<div class="layout"><section class="card"><h2>Transaksi Baru</h2><p class="subtitle">Form operasional petugas dengan waktu WITA dan asal otomatis.</p><div class="grid">
<div class="field full"><label>Nama Penumpang</label><div class="input">Contoh Pelanggan</div></div><div class="field"><label>Nomor Identitas</label><div class="input">••••••••••••••</div></div><div class="field"><label>Nomor HP</label><div class="input">08•• •••• ••••</div></div><div class="field"><label>Tujuan</label><div class="input">Labuan Bajo</div></div><div class="field"><label>Petugas</label><div class="input">Petugas A ▾</div></div><div class="field full"><label>Premi</label><div class="premium"><div class="chip active">IDR 20.000</div><div class="chip">IDR 40.000</div></div></div><div class="field full"><label>Catatan</label><div class="input">Perjalanan contoh untuk tampilan portofolio</div></div></div>
<div class="actions"><div class="btn secondary">Transaksi Baru</div><div class="btn primary">Buat Nota</div></div><div class="notice">Tanggal dan jam transaksi dicatat otomatis. Masa perlindungan berakhir 24 jam setelah transaksi.</div></section>
<aside class="receipt-wrap"><div><div style="font-size:11px;font-weight:800;color:#607888;margin:0 0 8px;text-align:center">PRATINJAU NOTA 80 MM</div><div class="receipt"><h3>TRAVEL PROTECTION</h3><div class="rule"/><div class="row">No. Nota : JT-20260903-001</div><div class="row">Tanggal : 03/09/2026 10:15 WITA</div><div class="row">Petugas : Petugas A</div><div class="rule"/><div class="row">Nama : Contoh Pelanggan</div><div class="row">Identitas : <span class="masked">hidden</span></div><div class="row">No. HP : <span class="masked">hidden</span></div><div class="row">Rute : Kupang - Labuan Bajo</div><div class="row">Periode : 03/09/2026 s/d 04/09/2026</div><div class="row"><b>Premi : IDR 20.000</b></div><div class="rule"/><div style="text-align:center;font-weight:800">MANFAAT / JAMINAN</div><div class="rule"/><div class="benefit">1. Meninggal dunia akibat kecelakaan<b>IDR 250.000.000</b></div><div class="benefit">2. Cacat tetap akibat kecelakaan<b>IDR 250.000.000</b></div><div class="benefit">3. Biaya perawatan medis darurat<b>IDR 25.000.000</b></div><div class="benefit">4. Kehilangan bagasi / barang pribadi<b>IDR 2.000.000</b></div><div class="rule"/><div style="text-align:center">Informasi kantor disamarkan</div><div class="rule"/><div style="text-align:center;font-size:10px">Bukti pembayaran sah. Pertanggungan mengikuti syarat dan ketentuan polis.</div></div></div></aside></div></div>
</body>
</foreignObject>
</svg>