<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<foreignObject width="1600" height="900">
<body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;width:1600px;height:900px;overflow:hidden">
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 20%,#e6f1ff,#f7fbff 46%,#fff);color:#071a33;font-family:Arial,Helvetica,sans-serif}.page{width:1180px;margin:auto;padding:34px 0 54px}.header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:29px;font-weight:900;letter-spacing:-2px}.brand span{color:#1769ff}.badge{padding:8px 12px;border:1px solid #cad9ec;border-radius:999px;background:#fff;color:#51657d;font-size:12px;font-weight:750}.intro{margin:54px 0 30px}.eyebrow{color:#1769ff;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;margin:0 0 13px}.intro h1{font-size:58px;line-height:1;margin:0 0 15px;letter-spacing:-3px}.intro p{font-size:17px;color:#65768a;max-width:690px;line-height:1.6;margin:0}.workspace{max-width:820px;background:#fff;border:1px solid #dce6f2;border-radius:26px;padding:30px 34px 34px;box-shadow:0 24px 70px rgba(7,26,51,.08)}.progressRow{display:flex;justify-content:space-between;color:#6e7f91;font-size:12px;font-weight:700}.track{height:6px;background:#eaf0f6;border-radius:999px;margin:11px 0 28px;overflow:hidden}.track span{display:block;width:25%;height:100%;background:#1769ff;border-radius:999px}.sectionNo{color:#1769ff;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.title h2{font-size:32px;margin:12px 0 7px;letter-spacing:-1.4px}.title p{margin:0 0 24px;color:#6b7b8e;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;color:#40546a;font-size:12px;font-weight:750;margin-bottom:7px}.input{height:48px;border:1px solid #cbd8e8;border-radius:12px;background:#fbfdff;padding:14px;color:#31465b;font-size:14px}.masked{letter-spacing:3px}.actions{display:flex;justify-content:flex-end;margin-top:26px}.button{height:48px;min-width:145px;border-radius:12px;background:#1769ff;color:#fff;font-weight:800;display:grid;place-items:center}.privacy{margin-top:20px;padding:13px 15px;border-radius:12px;background:#f5f8fb;color:#728295;font-size:12px}.proof{position:absolute;right:130px;top:250px;width:280px}.proofCard{background:#071a33;color:white;border-radius:22px;padding:24px;box-shadow:0 22px 50px rgba(7,26,51,.15)}.proofCard small{color:#8eb9ff;text-transform:uppercase;font-weight:800;letter-spacing:1px}.proofCard h3{font-size:24px;margin:12px 0 19px;letter-spacing:-.7px}.step{padding:12px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px}.step b{color:#8eb9ff;margin-right:9px}.demo{position:fixed;right:18px;top:18px;background:#071a33;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:700}
</style>
<div class="demo">DATA CONTOH · UI QIRA DISCOVERY</div><div class="page"><div class="header"><div class="brand">QIRA<span>.</span></div><div class="badge">±2 menit</div></div><section class="intro"><p class="eyebrow">Sedikit lagi</p><h1>Biar solusinya lebih pas.</h1><p>Empat pertanyaan singkat, lalu QIRA menghubungimu lewat WhatsApp.</p></section><section class="workspace"><div class="progressRow"><span>1 / 4</span><span>25%</span></div><div class="track"><span/></div><div class="sectionNo">Kenalan singkat</div><div class="title"><h2>Kenalan dulu.</h2><p>WhatsApp dipakai QIRA untuk menindaklanjuti, bukan dikirim ke pihak lain.</p></div><div class="grid"><div class="field"><label>Nama</label><div class="input">Contoh Pengguna</div></div><div class="field"><label>Usaha</label><div class="input">Usaha Contoh</div></div><div class="field"><label>WhatsApp</label><div class="input masked">08•• •••• ••••</div></div><div class="field"><label>Email (opsional)</label><div class="input">contoh@domain.test</div></div></div><div class="privacy">Data pada tampilan ini hanya data contoh untuk portofolio.</div><div class="actions"><div class="button">Lanjut</div></div></section><aside class="proof"><div class="proofCard"><small>Alur discovery</small><h3>Dari masalah menjadi arah solusi.</h3><div class="step"><b>01</b>Kenalan singkat</div><div class="step"><b>02</b>Kebutuhan usaha</div><div class="step"><b>03</b>Cara kerja sekarang</div><div class="step"><b>04</b>Saran awal &amp; tindak lanjut</div></div></aside></div>
</body>
</foreignObject>
